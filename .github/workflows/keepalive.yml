name: Keep backend awake

# Render's free tier spins the backend process down after ~15 min with no inbound HTTP
# traffic. A timer inside that same process can't wake it back up once it's suspended, so
# this hits /health from outside on a schedule instead. GitHub's scheduler queues jobs and
# doesn't guarantee exact timing, but at a 4-minute cron this keeps requests landing well
# inside Render's 15-minute idle window.
on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS https://naraway-sales.onrender.com/health
